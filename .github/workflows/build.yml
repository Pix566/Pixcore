name: Build

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        run: gradle clean build --no-daemon --console=plain

      - name: Upload Paper plugin
        uses: actions/upload-artifact@v4
        with:
          name: Pixcore-Plugin
          path: paper-plugin/build/libs/*.jar

      - name: Upload NeoForge mod
        uses: actions/upload-artifact@v4
        with:
          name: Pixcore-NeoForge
          path: neoforge-mod/build/libs/*.jar

      - name: Upload shared protocol
        uses: actions/upload-artifact@v4
        with:
          name: Pixcore-Protocol
          path: protocol/build/libs/*.jar
